<title>つぐもの 概要資料</title>
<style>
  :root { --bg: #14171d; --ink: #f1ead8; --muted: #9ea3ab; --teal: #0f7b8a; --gold: #f2c14e; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: "Hiragino Sans", "Yu Gothic", sans-serif; padding: 24px; }
  main { width: min(100%, 360px); text-align: center; }
  .logo { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 800; font-size: 44px; letter-spacing: .06em; margin: 0 0 6px; }
  .logo i { font-style: normal; color: var(--gold); }
  p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  form { display: grid; gap: 12px; }
  input, button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #2f3540; }
  input { background: #1d2129; color: var(--ink); }
  button { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #err { min-height: 1.4em; color: #ff8a80; font-size: 14px; margin: 10px 0 0; }
</style>
</head>

const ITER = 600000;
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(password) {
  const raw = b64(PAYLOAD);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);
}

async function open(password) {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const html = await decrypt(password);
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = (e && e.name === 'OperationError') ? 'パスワードが違います。' : '開けませんでした。ブラウザを更新して、もう一度お試しください。';
    btn.disabled = false;
  }
}

document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); open(document.getElementById('pw').value); });
